[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "district-court-api-scraper"
version = "0.1.0"
description = "Direct HTTP scraper for district eCourts (Selenium-free)."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.0",
  "beautifulsoup4>=4.12.0",
  "pillow>=10.4.0",
  "opencv-python>=4.10.0.84",
  "pytesseract>=0.3.13",
  "google-genai>=1.0.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
district-court-api-scraper = "district_court_api_scraper.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
